name: saas_store

services:

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: saas_store_api
    env_file:
      - .env
      - apps/api/.env
    environment:
      # Container networking: reach Postgres by service name, not the host loopback.
      DB_HOST: postgres
      DB_PORT: 5432
      # Reach Redis by service name. Redis is the only API cache store.
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      # Bind-mounted source on Windows/macOS does not emit inotify events reliably,
      # so tell the TypeScript watcher to poll instead.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_PORT:-4000}:${APP_PORT:-4000}"
    volumes:
      # Live reload: host source over the image, with container node_modules preserved
      # (the root workspace store plus the per-app symlink trees).
      - .:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/store_owner_dashboard/node_modules
      - /repo/apps/super_admin_dashboard/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter saas_store_api dev

  redis:
    image: redis:7-alpine
    container_name: saas_store_redis
    restart: unless-stopped
    # Cache-only Redis: no persistence, LRU eviction under memory pressure.
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: saas_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-saas_store}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Override POSTGRES_HOST_PORT if 5432 is already taken by a local Postgres.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-saas_store}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
