resolver 127.0.0.11 valid=10s ipv6=off;

log_format upstreamlog '$remote_addr - [$time_local] "$request" '
                       'upstream: $upstream_addr status: $upstream_status';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log upstreamlog;

    # Product uploads: MAX_PRODUCT_IMAGES (5) x MAX_FILE_SIZE (5 MB) + multipart overhead.
    # nginx defaults to 1m and would reject uploads with 413.
    client_max_body_size 32m;

    location / {
        set $upstream api;
        proxy_pass http://$upstream:4000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
